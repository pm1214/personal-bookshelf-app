<title>BookShelf Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar + work area on desktop; on phones a bottom nav, and on the series page a sticky brush bar at the bottom. */
:root{
  --bg:#f4f4f8; --surface:#ffffff; --sunk:#ecebf3; --line:#e1e0ea;
  --ink:#1f2030; --muted:#6f7086; --faint:#9a9bb0;
  --accent:#6a5cc8; --accent-ink:#ffffff; --accent-soft:#ece9fb;
  --danger:#c8443f; --danger-soft:#fbeceb; --ok:#2f8a5b;
  --shadow:0 10px 30px rgba(30,28,60,.12);
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-num:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15151d; --surface:#1e1e29; --sunk:#262634; --line:#33334a;
  --ink:#ececf4; --muted:#a3a3b9; --faint:#76768e;
  --accent:#9d91f0; --accent-ink:#17162a; --accent-soft:#2c2946;
  --danger:#ef7a74; --danger-soft:#3a2224; --ok:#6cc896;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15151d; --surface:#1e1e29; --sunk:#262634; --line:#33334a;
  --ink:#ececf4; --muted:#a3a3b9; --faint:#76768e;
  --accent:#9d91f0; --accent-ink:#17162a; --accent-soft:#2c2946;
  --danger:#ef7a74; --danger-soft:#3a2224; --ok:#6cc896;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:100vh}
.side{border-right:1px solid var(--line);padding:28px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.3px;padding:0 10px}
.brand b{color:var(--accent)}
.tag{font-size:12px;color:var(--muted);padding:0 10px 18px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn .ic{width:18px;text-align:center}
.side .foot{margin-top:auto;font-size:11px;color:var(--faint);padding:0 10px;line-height:1.5}

main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:760px){main{padding-left:36px;padding-right:36px}}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font-size:26px;line-height:1.25;margin:4px 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.btn{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--danger)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.tools .input[type=search]{flex:1 1 200px}

.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--muted)}
.row .right{text-align:right;font-size:13px;white-space:nowrap}
.row .right .miss{color:var(--danger);font-weight:700}
.strip{grid-column:1/-1;display:flex;gap:1px;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.strip i{flex:1 1 0;min-width:0;background:var(--sunk)}
.strip i.gap{background:transparent;box-shadow:inset 0 -3px 0 var(--danger)}
.strip i.plan{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--sunk);border-radius:999px;padding:2px 9px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
.sample{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:6px;vertical-align:2px}

/* series detail */
.back{margin-bottom:10px}
.facts{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.facts label{display:inline-flex;align-items:center;gap:6px}
.facts .input{padding:5px 8px;width:auto}
.facts input.input{width:4.5em}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.sw.gap{border:2px dashed var(--danger)}
.sw.plan{border:2px dashed var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.vol{position:relative;aspect-ratio:1;max-width:100%;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px;font-weight:600;padding:0;color:var(--ink);-webkit-touch-callout:none}
.vol.owned{border-color:transparent}
.vol.gap{border:2px dashed var(--danger);color:var(--danger)}
.vol.plan{border:2px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.vol.beyond{opacity:.85}
.vol .lbl{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:inherit}
.vol.small .lbl{font-size:11px}
.vol .rd{position:absolute;right:3px;top:2px;font-size:10px;line-height:1}
.vol.anchor{outline:3px solid var(--ink);outline-offset:2px}
.vol.inrange{outline:2px solid var(--accent);outline-offset:1px}
.vol:hover{filter:brightness(1.05)}

.brushbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.brushes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.brushes::-webkit-scrollbar{display:none}
.brush{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.brush .k{font-family:var(--f-num);font-size:10px;color:var(--faint)}
.brushrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.panel p{margin:0 0 10px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form .input{flex:1 1 220px}
.msg{font-size:13px;margin-top:8px;white-space:pre-line}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
code{font-family:var(--f-num);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 16px}

/* stores */
.storelist{display:grid;gap:8px}
.storeitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.swbtn{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex:none}
.storeitem .input{flex:1 1 160px}
.storecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.storecard .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.storecard .hd .num{margin-left:auto;font-size:18px}
.storecard ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:13px}
.storecard li{display:flex;justify-content:space-between;gap:10px}
.storecard li button{border:0;background:none;padding:0;text-align:left;color:var(--ink);overflow-wrap:anywhere}
.storecard li button:hover{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
textarea.input{width:100%;min-height:110px;font-family:var(--f-num);font-size:12px;resize:vertical}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.modalbg{position:fixed;inset:0;background:rgba(10,10,25,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(440px,100%);box-shadow:var(--shadow);display:grid;gap:12px}
.modal h2{margin:0}
.field{display:grid;gap:5px;font-size:13px;font-weight:700}
.field .input{font-weight:400}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.bottom{display:none}
@media(max-width:760px){
  .app{display:block}
  .side{display:none}
  main{padding-block:20px 110px}
  h1{font-size:22px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
  .bottom .navbtn{flex-direction:column;gap:0;font-size:11px;padding:6px 10px}
  .bottom .navbtn .ic{font-size:17px}
  body.detail .bottom{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
}
@media (hover:none){.brush .k{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" aria-label="メニュー">
    <div class="brand">BookShelf <b>Hub</b></div>
    <div class="tag">巻ごとに、どのストアで買ったか</div>
    <button class="navbtn" data-act="nav" data-view="library"><span class="ic">▦</span>マイ本棚</button>
    <button class="navbtn" data-act="nav" data-view="missing"><span class="ic">◌</span>抜け巻・予定</button>
    <button class="navbtn" data-act="nav" data-view="stores"><span class="ic">▤</span>ストア別</button>
    <button class="navbtn" data-act="nav" data-view="settings"><span class="ic">⚙</span>設定・バックアップ</button>
    <div class="foot">デモ v2。データはこのブラウザ内だけに保存されます。</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="メニュー">
  <button class="navbtn" data-act="nav" data-view="library"><span class="ic">▦</span>本棚</button>
  <button class="navbtn" data-act="nav" data-view="missing"><span class="ic">◌</span>抜け巻</button>
  <button class="navbtn" data-act="nav" data-view="stores"><span class="ic">▤</span>ストア</button>
  <button class="navbtn" data-act="nav" data-view="settings"><span class="ic">⚙</span>設定</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" data-act="undo" hidden>元に戻す</button></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============ データ ============ */
const KEY2 = 'bookshelf_hub_v2', KEY1 = 'bookshelf_hub_demo_v1';
const PALETTE = ['#E07B1F','#2F86D1','#D6457A','#1E9C84','#7E5BCB','#5F6F86','#9A6B3F','#B8A000','#3F9E3A','#C2412D'];
const DEFAULT_STORES = [
  {id:'kindle', name:'Kindle',       color:'#E07B1F', alias:['キンドル','amazon','アマゾン']},
  {id:'kobo',   name:'Kobo',         color:'#2F86D1', alias:['楽天','コボ','rakuten','楽天kobo']},
  {id:'ebj',    name:'ebookjapan',   color:'#D6457A', alias:['ebj','イーブック','ebook']},
  {id:'bw',     name:'BOOK☆WALKER',  color:'#1E9C84', alias:['bw','bookwalker','ブックウォーカー','ブクウォ']},
  {id:'honto',  name:'honto',        color:'#7E5BCB', alias:['ホント']},
  {id:'dmm',    name:'DMMブックス',   color:'#5F6F86', alias:['dmm']},
  {id:'paper',  name:'紙の本',        color:'#9A6B3F', alias:['紙','paper','かみ']}
];
const KINDS = ['漫画','ライトノベル','一般書'];

const uid = () => Math.random().toString(36).slice(2, 10);
const nfkc = s => String(s ?? '').normalize('NFKC').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isIntLabel = l => /^\d+$/.test(l);
const UPDOWN = {'上':1,'中':2,'下':3,'前':1,'後':2};

function sortKeyFor(label, vols){
  const l = nfkc(label);
  if (/^\d+(\.\d+)?$/.test(l)) return Number(l);
  if (l in UPDOWN) return UPDOWN[l];
  const max = vols.reduce((m, v) => Math.max(m, v.sort), 0);
  return Math.floor(max) + 0.9;           // 外伝などは最後尾
}
const mkVol = (label, vols) => ({id:uid(), label:nfkc(label), sort:sortKeyFor(label, vols||[]), stores:[], planned:false, read:false});

function seed(){
  const S = (title, kind, total, fill) => {
    const s = {id:uid(), title, kind, total, main:'', sample:true, volumes:[]};
    ensureVolumes(s); fill(s); sortVols(s); return s;
  };
  const v = (s, l) => { let x = s.volumes.find(q => q.label === String(l)); if (!x){ x = mkVol(String(l), s.volumes); s.volumes.push(x);} return x; };
  return {
    version:2,
    stores: DEFAULT_STORES.map(s => ({...s, alias:[...s.alias]})),
    series: [
      S('作品A（サンプル）','漫画',18, s => {
        for (let i=1;i<=10;i++) v(s,i).stores=['kindle'];
        for (let i=11;i<=15;i++) v(s,i).stores=['kobo'];
        v(s,16).stores=['ebj']; v(s,18).stores=['kindle','kobo'];
        for (let i=1;i<=12;i++) v(s,i).read=true;
        s.main='kindle';
      }),
      S('作品B（サンプル）','ライトノベル',12, s => {
        v(s,1).stores=['kindle']; v(s,2).stores=['kindle']; v(s,3).stores=['kobo']; v(s,4).stores=['ebj'];
        v(s,'4.5').stores=['bw']; v(s,6).stores=['kindle']; v(s,7).stores=['kindle']; v(s,9).planned=true;
      }),
      S('作品C（サンプル）','漫画',8, s => {
        v(s,1).stores=['kindle','kobo'];
        for (let i=2;i<=8;i++) v(s,i).stores=['kobo'];
        s.main='kobo';
      }),
      S('作品D（サンプル）','一般書',0, s => { v(s,'上').stores=['paper']; v(s,'下').planned=true; })
    ]
  };
}

function ensureVolumes(s){
  for (let n = 1; n <= s.total; n++) if (!s.volumes.some(v => v.label === String(n))) s.volumes.push(mkVol(String(n), s.volumes));
  // 既刊数より後ろの、何も記録のない巻は消す（記録がある巻は残す）
  s.volumes = s.volumes.filter(v => !(isIntLabel(v.label) && Number(v.label) > s.total && !hasData(v)));
  sortVols(s);
}
const hasData = v => v.stores.length || v.planned || v.read;
const sortVols = s => s.volumes.sort((a, b) => a.sort - b.sort || a.label.localeCompare(b.label, 'ja'));

/* ---- 読み込み・移行・検証 ---- */
function sanitize(obj){
  if (!obj || typeof obj !== 'object') return null;
  if (Array.isArray(obj.books) || Array.isArray(obj)) return fromV1(Array.isArray(obj) ? obj : obj.books);
  if (obj.version !== 2 || !Array.isArray(obj.stores) || !Array.isArray(obj.series)) return null;
  const idOk = x => typeof x === 'string' && /^[\w-]{1,40}$/.test(x);
  const color = c => /^#[0-9a-fA-F]{6}$/.test(c) ? c : PALETTE[0];
  const stores = []; const seen = new Set();
  for (const st of obj.stores){
    if (!st || !idOk(st.id) || seen.has(st.id)) continue; seen.add(st.id);
    stores.push({id:st.id, name:nfkc(st.name).slice(0,30) || st.id, color:color(st.color), alias:Array.isArray(st.alias) ? st.alias.map(a=>nfkc(a).slice(0,30)).slice(0,10) : []});
  }
  if (!stores.length) return null;
  const series = [];
  for (const s of obj.series){
    if (!s || typeof s.title !== 'string' || !Array.isArray(s.volumes)) return null;
    const total = Math.max(0, Math.min(999, Math.floor(Number(s.total) || 0)));
    const out = {id: idOk(s.id) ? s.id : uid(), title:nfkc(s.title).slice(0,120) || '無題', kind: KINDS.includes(s.kind) ? s.kind : '漫画',
                 total, main: seen.has(s.main) ? s.main : '', sample: !!s.sample, volumes:[]};
    const labels = new Set();
    for (const v of s.volumes.slice(0, 1200)){
      const label = nfkc(v && v.label).slice(0,12); if (!label || labels.has(label)) continue; labels.add(label);
      out.volumes.push({id:uid(), label, sort: Number.isFinite(v.sort) ? v.sort : sortKeyFor(label, out.volumes),
        stores: Array.isArray(v.stores) ? [...new Set(v.stores.filter(x => seen.has(x)))] : [],
        planned: !!v.planned, read: !!v.read});
    }
    ensureVolumes(out); series.push(out);
  }
  return {version:2, stores, series};
}
function fromV1(books){
  const stores = DEFAULT_STORES.map(s => ({...s, alias:[...s.alias]}));
  const byName = n => {
    const k = nfkc(n).toLowerCase();
    let st = stores.find(s => s.name.toLowerCase() === k || s.alias.includes(k));
    if (!st && k){ st = {id:'s'+uid(), name:nfkc(n).slice(0,30), color:PALETTE[stores.length % PALETTE.length], alias:[]}; stores.push(st); }
    return st && st.id;
  };
  const series = [];
  for (const b of books){
    if (!b || typeof b.title !== 'string') return null;
    const total = Math.max(0, Math.min(999, Math.floor(Number(b.total) || 0)));
    const s = {id:uid(), title:nfkc(b.title).slice(0,120), kind: b.type === '漫画' ? '漫画' : b.type === 'ライトノベル' ? 'ライトノベル' : '一般書', total, main:'', volumes:[]};
    const owned = b.owned && typeof b.owned === 'object' ? b.owned : {};
    for (const [n, list] of Object.entries(owned)){
      if (!Array.isArray(list) || !list.length) continue;
      const v = mkVol(nfkc(n), s.volumes); v.stores = [...new Set(list.map(byName).filter(Boolean))]; s.volumes.push(v);
    }
    ensureVolumes(s); series.push(s);
  }
  return {version:2, stores, series};
}
function load(){
  try { const raw = localStorage.getItem(KEY2); if (raw){ const d = sanitize(JSON.parse(raw)); if (d) return d; } } catch {}
  try { const raw = localStorage.getItem(KEY1); if (raw){ const d = sanitize(JSON.parse(raw)); if (d){ state0Msg = '以前のデモのデータを新しい形式に移しました'; return d; } } } catch {}
  return seed();
}

const storeById = id => data.stores.find(s => s.id === id);
const series = id => data.series.find(s => s.id === id);

function stats(s){
  const ints = s.volumes.filter(v => isIntLabel(v.label) && Number(v.label) >= 1 && Number(v.label) <= s.total);
  const owned = s.volumes.filter(v => v.stores.length);
  const gaps = ints.filter(v => !v.stores.length && !v.planned);
  const planned = s.volumes.filter(v => !v.stores.length && v.planned);
  const read = s.volumes.filter(v => v.read).length;
  const storesUsed = [...new Set(owned.flatMap(v => v.stores))];
  const pct = s.total ? Math.round(100 * ints.filter(v => v.stores.length).length / s.total) : (s.volumes.length ? Math.round(100*owned.length/s.volumes.length) : 0);
  return {owned:owned.length, gaps, planned, read, storesUsed, pct};
}

const $ = sel => document.querySelector(sel);
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#1b1b22' : '#ffffff';
}
function volBg(v){
  const cols = v.stores.map(id => (storeById(id) || {}).color).filter(Boolean);
  if (!cols.length) return '';
  if (cols.length === 1) return `background:${cols[0]};color:${textOn(cols[0])}`;
  const step = 100 / cols.length;
  const stops = cols.map((c, i) => `${c} ${i*step}% ${(i+1)*step}%`).join(',');
  return `background:linear-gradient(135deg,${stops});color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)`;
}
function stripHtml(s){
  const vs = s.volumes.slice(0, 400);
  return `<div class="strip" aria-hidden="true">${vs.map(v => {
    if (v.stores.length) return `<i style="background:${(storeById(v.stores[0])||{}).color||'var(--faint)'}"></i>`;
    if (v.planned) return '<i class="plan"></i>';
    if (isIntLabel(v.label) && Number(v.label) <= s.total) return '<i class="gap"></i>';

  }).join('')}</div>`;
}

/* ---- 塗る ---- */
function applyBrush(vols, brush){
  if (!vols.length) return '';
  const range = vols.length > 1 ? `${vols[0].label}〜${vols[vols.length-1].label}巻` : `${vols[0].label}巻`;
  if (brush === '_erase'){ vols.forEach(v => { v.stores = []; v.planned = false; }); return `${range}を未購入にしました`; }
  if (brush === '_read'){ const all = vols.every(v => v.read); vols.forEach(v => v.read = !all); return `${range}を${all ? '未読' : '既読'}にしました`; }
  if (brush === '_plan'){
    const t = vols.filter(v => !v.stores.length); if (!t.length) return `${range}はすでに所持しています`;
    const all = t.every(v => v.planned); t.forEach(v => v.planned = !all); return `${range}の購入予定を${all ? '外し' : '付け'}ました`;
  }
  const st = storeById(brush); if (!st) return '';
  const all = vols.every(v => v.stores.includes(brush));
  vols.forEach(v => {
    if (all) v.stores = v.stores.filter(x => x !== brush);
    else if (!v.stores.includes(brush)){ v.stores.push(brush); v.planned = false; }
  });
  return `${range}${all ? 'から' : 'に'}${st.name}を${all ? '外しました' : '付けました'}`;
}
function tapVolume(vid, shift){
  const s = series(ui.active);

    const a = s.volumes.findIndex(v => v.id === ui.anchor), b = s.volumes.findIndex(v => v.id === vid);
    ui.anchor = null;
    const vols = s.volumes.slice(Math.min(a, b), Math.max(a, b) + 1);
    pushUndo(); const msg = applyBrush(vols, ui.brush); commit(msg, true);
    return;
  }
  const v = s.volumes.find(x => x.id === vid); if (!v) return;
  pushUndo(); const msg = applyBrush([v], ui.brush); commit(msg, false);
}
function commit(msg, withUndo){ save(); refreshDetail(); if (msg) toast(msg, withUndo); }

/* ---- まとめて入力 ---- */
function resolveToken(tok){
  const k = nfkc(tok).toLowerCase().replace(/[☆\s]/g, '');
  if (['予定','購入予定','planned','plan'].includes(k)) return '_plan';
  if (['既読','読了','read'].includes(k)) return '_read';
  if (['未購入','消す','なし','clear','none'].includes(k)) return '_erase';
  for (const s of data.stores){
    const names = [s.id, s.name, ...s.alias].map(x => nfkc(x).toLowerCase().replace(/[☆\s]/g, ''));
    if (names.includes(k)) return s.id;
  }
  for (const s of data.stores){ if (nfkc(s.name).toLowerCase().replace(/[☆\s]/g,'').startsWith(k) && k.length >= 2) return s.id; }
  return null;
}
function runRangeText(text){
  const s = series(ui.active);
  const segs = nfkc(text).replace(/(\d)\s*[〜～~ー－–—-]\s*(?=\d)/g, '$1-').split(/[,、;\n]+/).map(x => x.trim()).filter(Boolean);
  if (!segs.length) return {err:'入力が空です。'};
  const plans = [], errs = [];
  for (const seg of segs){
    const parts = seg.split(/\s+/);
    let head = parts.shift(), m;
    // 「1-10kindle」のように詰めて書かれた場合
    if ((m = head.match(/^(\d+(?:-\d+)?)([^\d.-].*)$/))){ head = m[1]; parts.unshift(m[2]); }
    const toks = parts.map(t => ({t, id:resolveToken(t)}));
    const bad = toks.filter(x => !x.id).map(x => x.t);
    if (!toks.length){ errs.push(`「${seg}」：ストア名などがありません`); continue; }
    if (bad.length){ errs.push(`「${seg}」：${bad.join('、')} が分かりません（設定でストアの別名を追加できます）`); continue; }
    if ((m = head.match(/^(\d+)-(\d+)$/))){
      let a = +m[1], b = +m[2]; if (a > b) [a, b] = [b, a];
      if (b - a > 999 || b > 999){ errs.push(`「${seg}」：範囲が大きすぎます`); continue; }
      plans.push({labels:Array.from({length:b - a + 1}, (_, i) => String(a + i)), ids:toks.map(x => x.id)});
    } else plans.push({labels:[head], ids:toks.map(x => x.id)});
  }
  if (errs.length) return {err:errs.join('\n')};
  pushUndo();
  let n = 0, created = 0;
  for (const p of plans){
    for (const label of p.labels){
      let v = s.volumes.find(x => x.label === label);
      if (!v){ v = mkVol(label, s.volumes); s.volumes.push(v); created++; }
      for (const id of p.ids){
        if (id === '_erase'){ v.stores = []; v.planned = false; }
        else if (id === '_read') v.read = true;
        else if (id === '_plan'){ if (!v.stores.length) v.planned = true; }
        else if (!v.stores.includes(id)){ v.stores.push(id); v.planned = false; }
      }
      n++;
    }
  }
  const maxInt = Math.max(0, ...s.volumes.filter(v => isIntLabel(v.label) && hasData(v)).map(v => +v.label));
  if (maxInt > s.total) s.total = maxInt;
  ensureVolumes(s); save(); refreshDetail();
  toast(`${n}巻ぶん反映しました${created ? `（${created}巻を新しく追加）` : ''}`, true);
  return {ok:true};
}

    <section class="panel" style="margin-top:0">
      <h2>ストア</h2>
      <p class="muted">色の四角をタップすると色が変わります。「別名」はまとめて入力で使える呼び名です（カンマ区切り）。</p>
      <div class="storelist">${data.stores.map(st => `
        <div class="storeitem">
          <button class="swbtn" style="background:${st.color}" data-act="storeColor" data-id="${esc(st.id)}" aria-label="${esc(st.name)}の色を変える"></button>
          <input class="input" data-store-name="${esc(st.id)}" value="${esc(st.name)}" maxlength="30" aria-label="ストア名">
          <input class="input" data-store-alias="${esc(st.id)}" value="${esc(st.alias.join(', '))}" placeholder="別名" aria-label="${esc(st.name)}の別名">
          <button class="btn ghost sm" data-act="storeDelete" data-id="${esc(st.id)}">削除</button>
        </div>`).join('')}</div>
      <form class="form" id="storeForm" style="margin-top:12px"><input class="input" id="newStore" placeholder="ストアを追加（例：コミックシーモア）" maxlength="30" aria-label="追加するストア名"><button class="btn ghost">追加</button></form>
    </section>
    <section class="panel">
      <h2>バックアップ</h2>
      <p class="muted">ブラウザのデータを消すと記録も消えます。ときどき書き出して保存してください。</p>
      <div class="form">
        <button class="btn" data-act="exportJson">JSONを書き出す</button>
        <button class="btn ghost" data-act="exportCsv">CSVを書き出す</button>
        <button class="btn ghost" data-act="pickFile">JSONファイルを読み込む</button>
        <input type="file" id="fileIn" accept="application/json,.json" hidden>
      </div>
      <p class="muted" style="margin:10px 0 6px">書き出した内容がここに出ます。ダウンロードできない環境では、コピーしてメモ等に保存してください。読み込むときは、ここに貼り付けて「貼り付けた内容を読み込む」を押します。</p>
      <textarea class="input" id="ioText" spellcheck="false" aria-label="書き出し・読み込み用のテキスト"></textarea>
      <div class="form" style="margin-top:8px"><button class="btn ghost sm" data-act="copyIo">コピー</button><button class="btn ghost sm" data-act="importText">貼り付けた内容を読み込む</button></div>
      <div class="msg" id="ioMsg"></div>
    </section>
    <section class="panel">
      <h2>サンプルに戻す</h2>
      <p class="muted">サンプルの4作品に戻します。今の記録はすべて消えます（直前なら「元に戻す」で戻せます）。</p>
      <button class="btn danger" data-act="reset">サンプルに戻す</button>
    </section>
    <section class="panel">
      <h2>このデモでできないこと</h2>
      <p class="muted" style="margin:0">書籍の検索、新刊の自動取得と通知、アカウントでの同期、ストアの購入履歴の取り込みは未対応です。作品と既刊数は手入力です。</p>
    </section>`;
}
function exportCsv(){
  const rows = [['作品','種類','巻','ストア','購入予定','既読']];
  for (const s of data.series) for (const v of s.volumes){
    if (!hasData(v)) continue;
    rows.push([s.title, s.kind, v.label, v.stores.map(id => (storeById(id)||{}).name).join('|'), v.planned ? '1' : '', v.read ? '1' : '']);
  }
  return rows.map(r => r.map(c => /[",\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c).join(',')).join('\n');
}
function tryDownload(text, name, type){
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch {}
}
function importText(text){
  const msg = $('#ioMsg'); msg.className = 'msg';
  let obj; try { obj = JSON.parse(text); } catch { msg.className = 'msg err'; msg.textContent = 'JSONとして読めませんでした。書き出した内容をそのまま貼り付けてください。'; return; }
  const d = sanitize(obj);
  if (!d){ msg.className = 'msg err'; msg.textContent = 'このアプリのバックアップ形式ではありません。'; return; }
  confirmBox(`${d.series.length}作品を読み込み、今の記録と置き換えます。`, '置き換える', () => {
    pushUndo(); data = d; save(); ui.view = 'library'; ui.active = null; render(); scrollTo(0, 0); toast(`${d.series.length}作品を読み込みました`, true);
  });
}

/* ============ モーダル・トースト ============ */
let toastTimer;
function toast(msg, withUndo){
  $('#toastMsg').textContent = msg; $('#toastUndo').hidden = !withUndo;
  $('#toast').classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), withUndo ? 6000 : 2600);
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function confirmBox(text, okLabel, fn){
  $('#modalRoot').innerHTML = `<div class="modalbg" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cfT">
    <h2 id="cfT">確認</h2><p style="margin:0">${esc(text)}</p>
    <div class="actions"><button class="btn ghost" data-act="modalClose">やめる</button><button class="btn danger" id="cfOk">${esc(okLabel)}</button></div></div></div>`;
  $('#cfOk').onclick = () => { closeModal(); fn(); }; $('#cfOk').focus();
}
function addSeriesModal(){
  $('#modalRoot').innerHTML = `<div class="modalbg" data-act="modalBg"><form class="modal" id="addForm" role="dialog" aria-modal="true" aria-labelledby="adT">
    <h2 id="adT">作品を追加</h2>
    <label class="field">作品名<input class="input" id="newTitle" required maxlength="120" placeholder="例：作品E"></label>
    <label class="field">種類<select class="input" id="newKind">${KINDS.map(k => `<option>${k}</option>`).join('')}</select></label>
    <label class="field">既刊数（巻数がない本は 0）<input class="input num" type="number" id="newTotal" min="0" max="999" value="10" required></label>
    <label class="field">主に買うストア<select class="input" id="newMain"><option value="">なし</option>${data.stores.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label>
    <label class="check"><input type="checkbox" id="newFill"> 既刊すべてをこのストアで所持として登録する</label>
    <div class="actions"><button type="button" class="btn ghost" data-act="modalClose">やめる</button><button class="btn">追加する</button></div>
  </form></div>`;
  $('#newTitle').focus();
  $('#addForm').onsubmit = e => {
    e.preventDefault();
    const title = nfkc($('#newTitle').value).slice(0,120), total = Math.floor(Number($('#newTotal').value));
    if (!title || !(total >= 0 && total <= 999)) return;
    pushUndo();
    const s = {id:uid(), title, kind:$('#newKind').value, total, main:$('#newMain').value, volumes:[]};
    ensureVolumes(s);
    if ($('#newFill').checked && s.main) s.volumes.forEach(v => v.stores = [s.main]);
    data.series.push(s); save(); closeModal();
    ui.active = s.id; ui.brush = s.main || ui.brush; ui.anchor = null; ui.edit = false; render(); scrollTo(0, 0);
    toast('作品を追加しました', true);
  };
}

/* ============ イベント ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'modalBg'){ if (e.target === t) closeModal(); return; }
  switch (act){
    case 'nav': ui.view = t.dataset.view; ui.active = null; ui.anchor = null; render(); scrollTo(0, 0); break;
    case 'open': ui.active = t.dataset.id; ui.anchor = null; ui.edit = false;
      { const s = series(ui.active); if (s && s.main) ui.brush = s.main; }
      render(); scrollTo(0, 0); break;
    case 'close': ui.active = null; ui.anchor = null; render(); break;
    case 'addSeries': addSeriesModal(); break;
    case 'modalClose': closeModal(); break;
    case 'undo': undo(); break;
    case 'brush': ui.brush = t.dataset.id; renderBrushes(); break;
    case 'rangeMode': ui.range = !ui.range; ui.anchor = null; renderBrushes(); renderGrid(); break;
    case 'vol':
      if (suppressClick){ suppressClick = false; return; }
      tapVolume(t.dataset.vid, e.shiftKey); break;
    case 'editTitle': ui.edit = !ui.edit; renderDetail($('#main')); if (ui.edit) $('#titleInput').focus(); break;
    case 'deleteSeries': {
      const s = series(ui.active);
      confirmBox(`「${s.title}」を削除します。`, '削除する', () => { pushUndo(); data.series = data.series.filter(x => x.id !== s.id); ui.active = null; save(); render(); toast('削除しました', true); });
      break; }
    case 'storeColor': {
      const st = storeById(t.dataset.id); pushUndo();
      st.color = PALETTE[(PALETTE.indexOf(st.color) + 1) % PALETTE.length]; save(); t.style.background = st.color; break; }
    case 'storeDelete': {
      const st = storeById(t.dataset.id);
      const n = data.series.reduce((a, s) => a + s.volumes.filter(v => v.stores.includes(st.id)).length, 0);
      const go = () => { pushUndo(); data.stores = data.stores.filter(x => x.id !== st.id); data.series.forEach(s => { s.volumes.forEach(v => v.stores = v.stores.filter(x => x !== st.id)); if (s.main === st.id) s.main = ''; }); save(); render(); toast(`${st.name}を削除しました`, true); };
      if (data.stores.length <= 1) return toast('ストアは1つ以上必要です');
      n ? confirmBox(`${st.name}を削除します。${n}巻ぶんの「${st.name}で所持」の記録も消えます。`, '削除する', go) : go();
      break; }
    case 'exportJson': {
      const txt = JSON.stringify({...data, exported_at:new Date().toISOString()}, null, 2);
      $('#ioText').value = txt; tryDownload(txt, 'bookshelf-hub-backup.json', 'application/json');
      $('#ioMsg').className = 'msg ok'; $('#ioMsg').textContent = '書き出しました。ダウンロードされない場合は「コピー」で保存してください。'; break; }
    case 'exportCsv': {
      const txt = exportCsv(); $('#ioText').value = txt; tryDownload('﻿' + txt, 'bookshelf-hub.csv', 'text/csv');
      $('#ioMsg').className = 'msg ok'; $('#ioMsg').textContent = 'CSVを書き出しました（1行＝1巻）。'; break; }
    case 'copyIo': {
      const ta = $('#ioText'); if (!ta.value) return;
      navigator.clipboard.writeText(ta.value).then(() => toast('コピーしました')).catch(() => { ta.focus(); ta.select(); toast('選択しました。コピーしてください'); });
      break; }
    case 'pickFile': $('#fileIn').click(); break;
    case 'importText': importText($('#ioText').value); break;
    case 'reset': confirmBox('サンプルの4作品に戻します。今の記録は消えます。', 'サンプルに戻す', () => { pushUndo(); data = seed(); save(); ui.view = 'library'; render(); toast('サンプルに戻しました', true); }); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q'){ ui.query = e.target.value; renderList(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'kindFilter'){ ui.kind = t.value; renderList(); }
  if (t.id === 'sortSel'){ ui.sort = t.value; renderList(); }
  if (t.id === 'totalInput'){
    const s = series(ui.active), n = Math.floor(Number(t.value));
    if (!(n >= 0 && n <= 999)){ t.value = s.total; return toast('既刊数は0〜999で入れてください'); }
    pushUndo(); const before = s.total; s.total = n; ensureVolumes(s); save(); refreshDetail();
    const kept = s.volumes.filter(v => isIntLabel(v.label) && +v.label > n).length;
    toast(`既刊数を${before}→${n}巻にしました${kept ? `。${n}巻より後ろの${kept}巻は記録があるので残しています` : ''}`, true);
  }
  if (t.id === 'mainSel'){ const s = series(ui.active); pushUndo(); s.main = t.value; save(); }
  if (t.dataset.storeName){ const st = storeById(t.dataset.storeName); const v = nfkc(t.value).slice(0,30); if (v){ pushUndo(); st.name = v; save(); } else t.value = st.name; }
  if (t.dataset.storeAlias){ const st = storeById(t.dataset.storeAlias); pushUndo(); st.alias = nfkc(t.value).split(/[,、]/).map(x => x.trim().toLowerCase()).filter(Boolean).slice(0,10); save(); }
  if (t.id === 'fileIn' && t.files[0]){ const txt = await t.files[0].text(); $('#ioText').value = txt; importText(txt); t.value = ''; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'rangeForm'){
    e.preventDefault(); const r = runRangeText($('#rangeText').value); const msg = $('#rangeMsg');
    if (r.err){ msg.className = 'msg err'; msg.textContent = r.err; } else { msg.className = 'msg ok'; msg.textContent = '反映しました。'; $('#rangeText').value = ''; }
  }
  if (f.id === 'volForm'){
    e.preventDefault(); const s = series(ui.active); const label = nfkc($('#volLabel').value).slice(0,12); const msg = $('#volMsg');
    if (!label){ return; }
    if (s.volumes.some(v => v.label === label)){ msg.className = 'msg err'; msg.textContent = `${label}巻はすでにあります。`; return; }
    pushUndo(); s.volumes.push(mkVol(label, s.volumes));
    if (isIntLabel(label) && +label > s.total) s.total = +label;
    ensureVolumes(s); save(); refreshDetail(); $('#volLabel').value = ''; msg.className = 'msg ok'; msg.textContent = `${label}巻を追加しました。`;
  }
  if (f.id === 'titleForm'){
    e.preventDefault(); const v = nfkc($('#titleInput').value).slice(0,120);
    if (v){ pushUndo(); series(ui.active).title = v; save(); } ui.edit = false; renderDetail($('#main'));
  }
  if (f.id === 'storeForm'){
    e.preventDefault(); const name = nfkc($('#newStore').value).slice(0,30); if (!name) return;
    if (data.stores.some(s => s.name === name)) return toast('同じ名前のストアがあります');
    pushUndo(); data.stores.push({id:'s' + uid(), name, color:PALETTE[data.stores.length % PALETTE.length], alias:[]}); save(); render(); toast(`${name}を追加しました`);
  }
});

/* 長押しで範囲の始点 */
let pressTimer = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.vol'); if (!t) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    suppressClick = true; ui.anchor = t.dataset.vid; renderBrushes(); renderGrid();
    if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
    toast('始まりの巻を選びました。終わりの巻をタップしてください');
  }, 450);
});
['pointerup','pointercancel','pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressTimer)));
document.addEventListener('pointermove', e => { if (e.movementX * e.movementX + e.movementY * e.movementY > 36) clearTimeout(pressTimer); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.vol')) e.preventDefault(); });

/* キーボード：数字でブラシ、Escで範囲解除、Ctrl/⌘+Zで元に戻す */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); return; }
  if (e.key === 'Escape'){ if ($('#modalRoot').innerHTML) return closeModal(); if (ui.anchor){ ui.anchor = null; renderBrushes(); renderGrid(); } return; }
  if (!ui.active || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9){ const b = brushList()[n - 1]; if (b){ ui.brush = b.id; renderBrushes(); } }
});

render();
</script>
